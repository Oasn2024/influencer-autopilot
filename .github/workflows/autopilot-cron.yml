# Runs the autopilot every 5 minutes. Vercel's Hobby plan only allows a daily cron
# (kept in vercel.json as a backstop), so GitHub Actions triggers the frequent runs.
# Needs repository secret CRON_SECRET (same value as in Vercel) and optionally
# repository variable APP_URL (defaults to the production URL).
name: Autopilot cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: autopilot-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger publishing and autopilot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://influencer-autopilot-ruddy.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/run"
